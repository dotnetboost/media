name: CI / CD

on:
  push:
    branches: [ main, develop ]
    tags:    [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_FEED: https://api.nuget.org/v3/index.json
  # Minimums enforced by the coverage-gate job below. Branch coverage is always the
  # lower of the two — a line runs the first time any path reaches it, while a branch
  # needs every path taken — so it gets its own, lower floor rather than dragging the
  # line minimum down to meet it.
  COVERAGE_THRESHOLD: 80
  BRANCH_COVERAGE_THRESHOLD: 75

jobs:
  # ───────────────────────────────────────────────────────────────────────
  build-and-unit-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Run unit tests
        run: |
          dotnet test tests/DotNetBoost.Media.UnitTests \
            --configuration Release --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results/unit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./test-results/unit/

  # ───────────────────────────────────────────────────────────────────────
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results

      # Merges the per-TFM cobertura files the unit-test job produced into one report.
      # JsonSummary is what the threshold check below reads; it carries the merged
      # percentages, so the check never has to pick between the net8.0 and net10.0 runs.
      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: './test-results/**/coverage.cobertura.xml'
          targetdir: './coverage-html'
          reporttypes: 'HtmlInline;Badges;MarkdownSummaryGithub;JsonSummary'
          tag: ${{ github.run_number }}

      - name: Publish coverage summary
        if: always()
        run: |
          [ -f "./coverage-html/SummaryGithub.md" ] && cat ./coverage-html/SummaryGithub.md >> $GITHUB_STEP_SUMMARY || true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-html, path: ./coverage-html/ }

      # Last in the job, and everything above it runs on failure, so a build that trips the
      # gate still leaves behind the HTML report and the step summary showing what slipped.
      - name: Enforce coverage thresholds
        run: |
          set -euo pipefail

          summary=./coverage-html/Summary.json
          if [ ! -f "${summary}" ]; then
            echo "::error::${summary} not found - the report step produced no JsonSummary"
            exit 1
          fi

          line=$(jq -r '.summary.linecoverage // empty' "${summary}")
          branch=$(jq -r '.summary.branchcoverage // empty' "${summary}")

          # An empty line coverage means the run measured nothing at all, which is the one
          # case a percentage comparison cannot catch: it must fail rather than wave through.
          if [ -z "${line}" ]; then
            echo "::error::No line coverage recorded in ${summary}"
            exit 1
          fi

          echo "Line coverage:   ${line}% (minimum ${COVERAGE_THRESHOLD}%)"
          echo "Branch coverage: ${branch:-n/a}% (minimum ${BRANCH_COVERAGE_THRESHOLD}%)"

          {
            echo "### Coverage gate"
            echo ""
            echo "| Metric | Measured | Minimum |"
            echo "| --- | --- | --- |"
            echo "| Line | ${line}% | ${COVERAGE_THRESHOLD}% |"
            echo "| Branch | ${branch:-n/a}% | ${BRANCH_COVERAGE_THRESHOLD}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          # These are decimals, which bash cannot compare; awk exits 0 when it is under.
          failed=0

          if awk -v v="${line}" -v t="${COVERAGE_THRESHOLD}" 'BEGIN { exit !(v + 0 < t + 0) }'; then
            echo "::error::Line coverage ${line}% is below the ${COVERAGE_THRESHOLD}% minimum"
            failed=1
          fi

          # Branch coverage is absent from the summary when nothing branches. That is a real
          # possibility for a small report and is not a failure, so only check a value present.
          if [ -n "${branch}" ] && awk -v v="${branch}" -v t="${BRANCH_COVERAGE_THRESHOLD}" 'BEGIN { exit !(v + 0 < t + 0) }'; then
            echo "::error::Branch coverage ${branch}% is below the ${BRANCH_COVERAGE_THRESHOLD}% minimum"
            failed=1
          fi

          exit "${failed}"

  # ───────────────────────────────────────────────────────────────────────
  provider-tests:
    name: Provider Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-unit-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

      - name: Run API endpoint tests
        run: |
          dotnet test tests/DotNetBoost.Media.ApiTests \
            --configuration Release --no-build \
            --logger "trx;LogFileName=api-tests.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./test-results/provider

      - name: Run provider (SQLite-backed) contract and wiring tests
        run: |
          dotnet test tests/DotNetBoost.Media.ProviderTests \
            --configuration Release --no-build \
            --logger "trx;LogFileName=provider-tests.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./test-results/provider

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: provider-test-results, path: ./test-results/provider/ }

  # ───────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Testcontainers, ${{ matrix.tfm }})
    runs-on: ubuntu-latest
    # SQL Server's image is an order of magnitude larger than Postgres and is slow to
    # become healthy, so this job needs more headroom than the others.
    timeout-minutes: 40
    needs: build-and-unit-test

    # Both shipped TFMs, as parallel jobs rather than one job running the suite twice: a net8.0
    # build resolves EF Core 8 and a net10.0 build EF Core 10, and those generate the SQL these
    # tests send to real PostgreSQL and SQL Server. Running them side by side costs two runners
    # and no extra wall clock. fail-fast is off so a failure on one TFM still reports the other —
    # which is the first thing you want to know when one of them breaks.
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

      # ubuntu-latest ships with a running Docker daemon, which Testcontainers uses to start
      # real servers for these tests: SQL Server, PostgreSQL and MongoDB for the metadata stores,
      # Azurite and LocalStack for the two cloud storage backends. The backends are the reason this
      # job matters most — a mocked cloud SDK proves only that the mock matches the test.
      - name: Run integration tests against real databases
        run: |
          dotnet test tests/DotNetBoost.Media.IntegrationTests \
            --configuration Release --no-build \
            --framework ${{ matrix.tfm }} \
            --logger "trx;LogFileName=integration-tests-${{ matrix.tfm }}.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./test-results/integration

      # One artifact per TFM: upload-artifact@v4 refuses to merge two uploads under one name.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ matrix.tfm }}
          path: ./test-results/integration/

  # ───────────────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: github/codeql-action/init@v3
        with: { languages: csharp, queries: security-and-quality }

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

      - uses: github/codeql-action/analyze@v3
        with: { category: "/language:csharp" }

      - name: Audit NuGet packages for vulnerabilities
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
        continue-on-error: true

      - name: Fail on critical vulnerabilities
        run: |
          if grep -qi "critical" vuln-report.txt; then
            echo "::error::Critical NuGet vulnerabilities detected"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vulnerability-report, path: vuln-report.txt }

  # ───────────────────────────────────────────────────────────────────────
  pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    needs: [ build-and-unit-test, provider-tests, integration-tests ]
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Branch builds are packed but never published (only tags are, see the publish jobs), so
      # their -preview.N / -dev.N versions just keep the uploaded artifacts distinguishable.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # `git describe | sed || echo` does not do what it looks like: `||` tests the exit
            # status of the *pipeline*, which is sed's, and sed succeeds on empty input. With no
            # tags in the repository the fallback never fired, BASE came out empty, and the
            # version became "-preview.N" — which pack rejects deep inside MSBuild. Test the
            # value, not the exit status.
            #
            # The newest tag is itself usually a prerelease (v1.0.0-preview.1), so strip any
            # -prerelease / +build suffix as well as the leading v and keep MAJOR.MINOR.PATCH.
            # Appending -preview.N to a base that already carries a prerelease suffix yields
            # 1.0.0-preview.1-preview.N: valid enough SemVer to pass the check below, and wrong
            # enough to publish under a name nobody is looking for.
            BASE=$(git describe --tags --abbrev=0 2>/dev/null | sed -E 's/^v//; s/[-+].*$//' || true)
            [[ -n "${BASE}" ]] || BASE="1.0.0"

            # Anything the strip did not reduce to MAJOR.MINOR.PATCH (a v1.0 tag, say) would
            # only surface later as an opaque pack failure.
            if [[ ! "${BASE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Derived base version '${BASE}' is not MAJOR.MINOR.PATCH"
              exit 1
            fi

            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
              VERSION="${BASE}-preview.${{ github.run_number }}"
            else
              VERSION="${BASE}-dev.${{ github.run_number }}"
            fi
          fi

          # Fail here with a readable message rather than as a NuGet task stack trace.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Computed package version '${VERSION}' is not valid SemVer"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Package version -> ${VERSION}"

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

      - name: Pack all library projects
        run: |
          for project in \
            DotNetBoost.Media.Core \
            DotNetBoost.Media.EntityFrameworkCore \
            DotNetBoost.Media.Dapper \
            DotNetBoost.Media.MongoDb \
            DotNetBoost.Media.FileSystem \
            DotNetBoost.Media.AzureBlobStorage \
            DotNetBoost.Media.AmazonS3 \
            DotNetBoost.Media.API; do
            dotnet pack "src/$project/$project.csproj" \
              --configuration Release --no-build \
              --output ./nupkgs \
              -p:PackageVersion=${{ steps.version.outputs.version }} \
              -p:RepositoryUrl=https://github.com/${{ github.repository }} \
              -p:RepositoryBranch=${{ github.ref_name }} \
              -p:RepositoryCommit=${{ github.sha }}
          done

      # Both globs: `*.nupkg` does not match `*.snupkg`, so listing only the first one left the
      # symbol packages behind in this job and the publish below pushed no symbols at all —
      # `dotnet nuget push` picks a .snupkg up only when it sits next to its own .nupkg.
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────
  publish-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [ pack, code-quality ]
    if: startsWith(github.ref, 'refs/tags/v')
    # Scope the nuget.org trusted-publishing policy to this environment and add required
    # reviewers to it: the temporary credential then only exists behind an approval.
    environment: nuget-release
    # Declaring permissions replaces the defaults rather than adding to them, so id-token has
    # to be listed even though only one step uses it. Without it the OIDC request fails and
    # NuGet/login yields an unusable key rather than an error.
    permissions:
      contents: write   # softprops/action-gh-release
      id-token: write   # OIDC token for trusted publishing

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with: { name: nuget-packages, path: ./nupkgs }

      - name: Verify packages exist
        run: |
          count=$(ls ./nupkgs/*.nupkg 2>/dev/null | wc -l)
          echo "Found ${count} .nupkg file(s)"
          [ "$count" -gt 0 ] || { echo "::error::No .nupkg files found"; exit 1; }

      # Trusted publishing: exchange a GitHub OIDC token for a short-lived nuget.org key
      # instead of storing a long-lived one. NUGET_USER is a profile name, not a credential.
      # The key lasts one hour and is single-use, so this sits immediately before the push.
      - name: NuGet login (OIDC to temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source "${{ env.NUGET_FEED }}" --skip-duplicate
          done

      - name: Generate release notes
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges > release-notes.md
          else
            echo "Initial release" > release-notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.pack.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(needs.pack.outputs.version, '-') }}
          files: ./nupkgs/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────
  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [ pack, code-quality ]
    # Tags only, like NuGet.org: a push to main or develop packs (so a broken package fails CI
    # early) but publishes nothing. Previews go out by tagging one, e.g. v1.0.0-preview.1.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: { packages: write }

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with: { name: nuget-packages, path: ./nupkgs }

      - run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      # --no-symbols: GitHub Packages rejects symbol packages, and push would otherwise send the
      # .snupkg sitting next to each .nupkg. Symbols go to NuGet.org only.
      - run: |
          for pkg in ./nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" --source github --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate --no-symbols
          done

  # ───────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [ build-and-unit-test, provider-tests, integration-tests, code-quality ]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ *${{ github.repository }}* — CI failed on `main`",
              "attachments": [{
                "color": "danger",
                "fields": [
                  { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
